name: Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 AM UTC

jobs:
  smoke:
    runs-on: ubuntu-latest

    # The smoke tests that store a pair (the ask path, the planner, the
    # summary) need Postgres with pgvector, and they SKIP themselves when
    # DATABASE_URL is missing. Without it the weekly run was green for all of
    # them without running one. A container, not the real Supabase project,
    # for the same reason as in ci.yaml: no secret, and no shared test schema.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/labpilot

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt

      # pgvector lives in `public` on Supabase, so put it there here too.
      - name: install pgvector into public
        run: >-
          python -c "import os, psycopg;
          psycopg.connect(os.environ['DATABASE_URL'], autocommit=True).execute(
          'create extension if not exists vector')"

      - run: pytest -m smoke --run-smoke -q -rxX
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          LITEROUTER_API_KEY: ${{ secrets.LITEROUTER_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ROUTEWAY_API_KEY: ${{ secrets.ROUTEWAY_API_KEY }}
          BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          JEV_PROXY_URL: ${{ secrets.JEV_PROXY_URL }}
          JEV_PROXY_SECRET: ${{ secrets.JEV_PROXY_SECRET }}
